name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 4 days at 06:00 UTC to prevent Supabase free-tier project pause
    - cron: "0 6 */4 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to prevent inactivity pause..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?key=eq.general&select=key" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Supabase is alive and responding!"
          else
            echo "❌ Unexpected status code: $STATUS"
            exit 1
          fi
